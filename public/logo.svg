<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Fundo arredondado gradiente -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#42A5F5" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo quadrado arredondado -->
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)"/>

  <!-- Círculos decorativos de fundo -->
  <circle cx="170" cy="30" r="50" fill="rgba(255,255,255,0.05)"/>
  <circle cx="30" cy="175" r="60" fill="rgba(255,255,255,0.04)"/>

  <!-- Barras do gráfico de colunas (crescendo da esquerda para direita) -->
  <rect x="38" y="130" width="22" height="40" rx="4" fill="#42A5F5" opacity="0.65"/>
  <rect x="68" y="112" width="22" height="58" rx="4" fill="#42A5F5" opacity="0.75"/>
  <rect x="98" y="88"  width="22" height="82" rx="4" fill="#64B5F6" opacity="0.85"/>
  <rect x="128" y="62" width="22" height="108" rx="4" fill="#90CAF9" opacity="1" filter="url(#glow)"/>

  <!-- Linha de tendência ascendente -->
  <polyline
    points="49,128 79,110 109,86 139,60"
    stroke="#FFD54F"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Ponto de destaque no topo -->
  <circle cx="139" cy="60" r="6" fill="#FF8F00" stroke="#FFD54F" stroke-width="2"/>

  <!-- Seta ascendente no canto superior direito -->
  <g transform="translate(154, 36)">
    <polyline
      points="0,18 8,0 16,18"
      stroke="url(#arrowGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <line x1="8" y1="0" x2="8" y2="20" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
